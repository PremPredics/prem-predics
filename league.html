<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prem Predics - League Hub</title>
<style>
* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #7b61d8 0%, #a98cf0 52%, #d3c4ff 100%);
  color: #f3f4f6;
}

header {
  padding: 25px 20px;
  background: linear-gradient(90deg, #7354ca 0%, #9677e2 54%, #bda9f5 100%);
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

header h1 {
  text-align: center;
  color: #fff;
  -webkit-text-stroke: 1.5px #05010c;
  text-shadow:
    -2px -2px 0 #05010c,
    2px -2px 0 #05010c,
    -2px 2px 0 #05010c,
    2px 2px 0 #05010c,
    0 0 12px rgba(216, 180, 254, 0.85),
    0 0 24px rgba(124, 58, 237, 0.55);
  margin: 0;
  font-size: clamp(2rem, 5.5vw, 3.35rem);
  line-height: 1.05;
  font-weight: 900;
  letter-spacing: 0;
}

main {
  width: min(1240px, 100%);
  margin: 0 auto;
  padding: 32px 18px 48px;
}

.toolbar {
  width: min(850px, 100%);
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.18fr) minmax(92px, .72fr);
  align-items: center;
  gap: 8px;
  margin: 0 auto 18px;
}

.toolbar a,
.toolbar button {
  min-width: 0;
  min-height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: #f3e8ff;
  text-decoration: none;
  text-align: center;
  font-weight: 850;
  background:
    linear-gradient(110deg,rgba(167,139,250,.09),transparent 52%),
    linear-gradient(145deg,rgba(46,16,102,.72),rgba(17,7,38,.66));
  border: 1px solid rgba(255,255,255,.78);
  border-radius: 10px;
  padding: 8px 10px;
  font-family: inherit;
  font-size: .8rem;
  line-height: 1.12;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px rgba(17,7,38,.18),0 6px 15px rgba(17,7,38,.2);
  -webkit-tap-highlight-color: transparent;
  transition: transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.toolbar a:hover,
.toolbar button:hover { transform: translateY(-1px); border-color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.18),0 0 0 1px rgba(17,7,38,.2),0 8px 18px rgba(17,7,38,.24); }

.toolbar a.profile-edit-link {
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 7px 6px 12px;
}

.toolbar a.how-to-play-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(110deg,rgba(167,139,250,.09),transparent 52%),
    linear-gradient(145deg,rgba(46,16,102,.72),rgba(17,7,38,.66));
  border-color: rgba(255,255,255,.78);
  color: #f3e8ff;
  font-weight: 800;
  text-shadow: inherit;
  box-shadow: 0 4px 15px rgba(17, 7, 38, 0.22);
}

.how-to-play-short {
  display: none;
}

.toolbar button.sign-out-btn {
  background:
    radial-gradient(circle at 24% 16%, rgba(255,255,255,0.78), transparent 20%),
    linear-gradient(135deg, #ef4444, #b91c1c 62%, #7f1d1d);
  border: 1px solid rgba(255,255,255,.78);
  color: #fff;
  box-shadow:
    0 0 12px rgba(248, 113, 113, 0.34),
    0 6px 15px rgba(127, 29, 29, 0.28);
  text-shadow:
    -1px -1px 0 rgba(0,0,0,0.78),
    1px -1px 0 rgba(0,0,0,0.78),
    -1px 1px 0 rgba(0,0,0,0.78),
    1px 1px 0 rgba(0,0,0,0.78);
}

.profile-edit-avatar {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 50%;
  background: linear-gradient(135deg, #f8e7ff, #c084fc);
  color: #2e1065;
  border: 2px solid rgba(255,255,255,0.72);
  box-shadow: 0 0 14px rgba(216, 180, 254, 0.28);
  font-weight: 950;
  line-height: 1;
}

.profile-edit-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.league-panel {
  background: rgba(46, 16, 102, 0.66);
  border: 2px solid rgba(196, 132, 252, 0.32);
  border-radius: 12px;
  padding: 22px;
  box-shadow: 0 14px 34px rgba(0,0,0,0.28);
}

.league-summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(340px, 0.95fr) minmax(170px, 0.42fr);
  gap: 16px;
  align-items: center;
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px solid rgba(216, 180, 254, 0.24);
}

.league-summary h2 {
  margin: 0 0 6px;
  color: #fff;
  -webkit-text-stroke: 0;
  text-shadow:
    -1px -1px 0 #05010c,
    1px -1px 0 #05010c,
    -1px 1px 0 #05010c,
    1px 1px 0 #05010c,
    0 0 10px rgba(216, 180, 254, 0.82);
  font-size: clamp(1.8rem, 5vw, 2.65rem);
  line-height: 1.05;
  font-weight: 900;
  text-align: center;
}

.league-members-count {
  margin: 0;
  color: #ddd6fe;
  font-size: 14px;
  font-weight: 900;
  text-align: center;
}

.league-summary p {
  margin: 0;
  color: #ddd6fe;
  line-height: 1.5;
}

.gameweek-card {
  --gameweek-border-color: #fff;
  min-height: 84px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: nowrap;
  padding: 16px 18px;
  border-radius: 8px;
  background: rgba(17, 7, 38, 0.46);
  border: 3px solid color-mix(in srgb, var(--gameweek-border-color) 78%, rgba(255,255,255,0.18));
  text-align: center;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 20px rgba(0,0,0,0.16);
}

.gameweek-card.is-countdown {
  --gameweek-border-color: #fff;
}

.gameweek-card.is-active {
  --gameweek-border-color: #37ff8b;
}

.gameweek-card span {
  color: #ddd6fe;
  font-size: clamp(0.96rem, 1.75vw, 1.24rem);
  font-weight: 900;
}

.gameweek-card strong {
  color: #fff;
  font-size: clamp(0.96rem, 1.75vw, 1.24rem);
  line-height: 1.1;
  overflow-wrap: normal;
}

.gameweek-card strong.active-gameweek {
  color: #37ff8b;
  text-shadow: 0 0 10px rgba(34, 197, 94, 0.44);
}

.join-code {
  min-width: 170px;
  display: grid;
  justify-items: center;
  gap: 5px;
  text-align: center;
  padding: 12px;
  border-radius: 8px;
  background: rgba(17, 7, 38, 0.34);
  border: 1px solid rgba(216, 180, 254, 0.2);
}

.join-code span {
  display: block;
  color: #ddd6fe;
  font-size: 13px;
}

.join-code strong {
  display: block;
  margin-top: 0;
  font-size: 20px;
  letter-spacing: 0;
}

.deadline-strip {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 9px;
  margin: 0 0 20px;
  padding: 12px;
  border: 1px solid rgba(216, 180, 254, 0.72);
  border-radius: 12px;
  background:
    linear-gradient(135deg, rgba(255,255,255,0.07), transparent 36%),
    rgba(17, 7, 38, 0.26);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 24px rgba(0,0,0,0.14);
}

.deadline-card {
  --deadline-color: #ff385c;
  display: grid;
  grid-template-rows: auto auto;
  gap: 7px;
  min-height: 64px;
  align-content: center;
  padding: 10px 9px;
  border-radius: 8px;
  background: rgba(17, 7, 38, 0.46);
  border: 1px solid color-mix(in srgb, var(--deadline-color) 38%, rgba(216,180,254,0.26));
  text-align: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
}

.deadline-card.good {
  --deadline-color: #3dff8c;
}

.deadline-card.action {
  --deadline-color: #ffb020;
}

.deadline-card.bad,
.deadline-card.locked {
  --deadline-color: #ff385c;
}

.deadline-card.disabled {
  --deadline-color: #a78bfa;
  opacity: 0.58;
}

.deadline-title {
  color: var(--deadline-color);
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
  line-height: 1.12;
  text-shadow: 0 0 9px color-mix(in srgb, var(--deadline-color) 42%, transparent);
}

.deadline-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(76px, auto) 22px;
  align-items: center;
  gap: 8px;
  width: 100%;
}

.deadline-action {
  grid-column: 1;
  min-width: 0;
  color: var(--deadline-color);
  font-size: 11px;
  font-weight: 950;
  line-height: 1;
  text-align: left;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 0 10px color-mix(in srgb, var(--deadline-color) 54%, transparent);
}

.deadline-action:empty {
  display: block;
  visibility: hidden;
}

.deadline-countdown {
  grid-column: 2;
  min-width: 76px;
  color: var(--deadline-color);
  font-size: 14px;
  font-weight: 950;
  text-align: right;
  white-space: nowrap;
  text-shadow: 0 0 11px color-mix(in srgb, var(--deadline-color) 50%, transparent);
}

.deadline-card.action .deadline-countdown {
  font-size: 13px;
}

.deadline-countdown:empty {
  display: none;
}

.deadline-card.message .deadline-body {
  grid-template-columns: minmax(0, 1fr) 22px;
}

.deadline-card.message .deadline-action {
  grid-column: 1;
  justify-self: center;
  text-align: center;
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  font-size: 9.5px;
  line-height: 1.08;
}
.join-code[hidden] { display: none !important; }

.deadline-card.prediction-lock-progress .deadline-action {
  justify-self: start;
  text-align: left;
}

.deadline-card.message .deadline-light {
  grid-column: 2;
}

.deadline-light {
  grid-column: 3;
  justify-self: end;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.62);
  background:
    radial-gradient(circle at 35% 28%, rgba(255,255,255,0.86), transparent 23%),
    radial-gradient(circle at 50% 52%, #ff385c, #dc143c 62%, #5f071b);
  box-shadow:
    0 0 13px rgba(255, 56, 92, 0.94),
    0 0 22px rgba(248, 113, 113, 0.46),
    inset 0 -3px 6px rgba(0,0,0,0.48);
}

.deadline-card.good .deadline-light {
  background:
    radial-gradient(circle at 35% 28%, rgba(255,255,255,0.86), transparent 23%),
    radial-gradient(circle at 50% 52%, #3dff8c, #16a34a 62%, #052e16);
  box-shadow:
    0 0 13px rgba(61, 255, 140, 0.94),
    0 0 22px rgba(74, 222, 128, 0.46),
    inset 0 -3px 6px rgba(0,0,0,0.48);
}

.deadline-card.action .deadline-light {
  background:
    radial-gradient(circle at 35% 28%, rgba(255,255,255,0.86), transparent 23%),
    radial-gradient(circle at 50% 52%, #ffb020, #f59e0b 62%, #7c2d12);
  box-shadow:
    0 0 13px rgba(255, 176, 32, 0.94),
    0 0 22px rgba(251, 191, 36, 0.48),
    inset 0 -3px 6px rgba(0,0,0,0.48);
}

.deadline-card.disabled .deadline-light {
  background:
    radial-gradient(circle at 35% 28%, rgba(255,255,255,0.72), transparent 23%),
    radial-gradient(circle at 50% 52%, #a78bfa, #6d28d9 62%, #2e1065);
  box-shadow:
    0 0 11px rgba(167, 139, 250, 0.66),
    inset 0 -3px 6px rgba(0,0,0,0.48);
}

@media (min-width: 721px) {
  .deadline-body {
    grid-template-columns: minmax(82px, 1fr) minmax(54px, auto) 18px;
    gap: 4px;
  }

  .deadline-action {
    font-size: 8.8px;
    overflow: visible;
    text-overflow: clip;
  }

  .deadline-countdown,
  .deadline-card.action .deadline-countdown {
    min-width: 54px;
    font-size: 12px;
  }

  .deadline-light {
    width: 16px;
    height: 16px;
  }

  .deadline-card.message .deadline-body {
    grid-template-columns: minmax(0, 1fr) 16px;
  }

  .deadline-card.message .deadline-action {
    font-size: 8.4px;
  }
}

.copy-code-btn {
  margin-top: 8px;
  border: 0;
  border-radius: 999px;
  padding: 7px 12px;
  background: linear-gradient(135deg, #facc15, #f59e0b);
  color: #fff;
  font-weight: 900;
  cursor: pointer;
  text-shadow:
    -1px -1px 0 rgba(0,0,0,0.88),
    1px -1px 0 rgba(0,0,0,0.88),
    -1px 1px 0 rgba(0,0,0,0.88),
    1px 1px 0 rgba(0,0,0,0.88);
  box-shadow: 0 0 14px rgba(250, 204, 21, 0.34);
}

.play-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(180px, 1fr));
  gap: 9px;
}

.play-card {
  --accent: #facc15;
  height: 92px;
  display: grid;
  align-content: center;
  gap: 5px;
  padding: 12px 38px 12px 15px;
  border-radius: 11px;
  background:
    linear-gradient(110deg,color-mix(in srgb,var(--accent) 8%,transparent),transparent 48%),
    linear-gradient(145deg,rgba(46,16,102,.7),rgba(17,7,38,.62));
  border: 1px solid color-mix(in srgb,var(--accent) 38%,rgba(216,180,254,.22));
  color: #fff;
  text-decoration: none;
  text-align: left;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 20px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.07);
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

.play-card::before {
  content: '';
  position: absolute;
  inset: 9px auto 9px 0;
  width: 4px;
  border-radius: 0 999px 999px 0;
  background: var(--accent);
  box-shadow: 0 0 12px color-mix(in srgb,var(--accent) 68%,transparent);
}

.play-card::after {
  content: '›';
  position: absolute;
  right: 10px;
  top: 50%;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border: 1px solid color-mix(in srgb,var(--accent) 34%,rgba(255,255,255,.15));
  border-radius: 7px;
  background: color-mix(in srgb,var(--accent) 12%,rgba(17,7,38,.76));
  color: var(--accent);
  font-size: 1.3rem;
  font-weight: 900;
  line-height: 1;
  transform: translateY(-50%);
}

.play-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 12px 24px rgba(0,0,0,.26),0 0 14px color-mix(in srgb,var(--accent) 24%,transparent);
}

.play-card strong {
  overflow: hidden;
  font-size: 1rem;
  line-height: 1.1;
  letter-spacing: 0;
  font-weight: 950;
  text-overflow: ellipsis;
  text-shadow: 0 1px 1px rgba(0,0,0,.9),0 0 8px color-mix(in srgb,var(--accent) 34%,transparent);
  white-space: nowrap;
  position: relative;
  z-index: 1;
}

.play-card span {
  display: -webkit-box;
  overflow: hidden;
  color: #ddd6fe;
  font-size: .72rem;
  font-weight: 700;
  line-height: 1.3;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  position: relative;
  z-index: 1;
}

button.play-card {
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
  font: inherit;
  cursor: pointer;
}
button.play-card:focus:not(:focus-visible) { outline: none; }
button.play-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

body.choice-panel-open { overflow: hidden; }
.hub-choice-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  padding: 18px;
}
.hub-choice-overlay[hidden] { display: none; }
.hub-choice-backdrop {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  background: rgba(8,3,20,.64);
  -webkit-backdrop-filter: blur(10px) saturate(.86);
  backdrop-filter: blur(10px) saturate(.86);
  cursor: default;
}
.hub-choice-dialog {
  --choice-accent: #22d3ee;
  position: relative;
  width: min(650px,100%);
  overflow: hidden;
  padding: 15px;
  border: 1px solid color-mix(in srgb,var(--choice-accent) 38%,rgba(216,180,254,.3));
  border-radius: 14px;
  background:
    linear-gradient(110deg,color-mix(in srgb,var(--choice-accent) 9%,transparent),transparent 46%),
    linear-gradient(145deg,rgba(46,16,102,.97),rgba(17,7,38,.97));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1),0 24px 58px rgba(0,0,0,.5),0 0 24px color-mix(in srgb,var(--choice-accent) 14%,transparent);
}
.hub-choice-topbar { margin-bottom: 10px; }
.hub-choice-back {
  display: block;
  min-width: 88px;
  margin: 11px auto 0;
  padding: 8px 16px;
  border: 1px solid rgba(216,180,254,.28);
  border-radius: 8px;
  background: rgba(17,7,38,.58);
  color: #f3e8ff;
  font: inherit;
  font-size: .8rem;
  font-weight: 900;
  cursor: pointer;
}
.hub-choice-heading { min-width: 0; text-align: center; }
.hub-choice-heading h2 { margin: 0; color: #fff; font-size: clamp(1.25rem,3vw,1.7rem); line-height: 1.05; }
.hub-choice-heading p { margin: 4px 0 0; color: #ddd6fe; font-size: .72rem; font-weight: 700; line-height: 1.3; }
.hub-choice-options { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
.hub-choice-option {
  --option-accent: var(--choice-accent);
  position: relative;
  min-width: 0;
  min-height: 96px;
  display: grid;
  align-content: center;
  gap: 5px;
  overflow: hidden;
  padding: 13px 37px 13px 14px;
  border: 1px solid color-mix(in srgb,var(--option-accent) 38%,rgba(216,180,254,.2));
  border-radius: 10px;
  background:
    linear-gradient(110deg,color-mix(in srgb,var(--option-accent) 9%,transparent),transparent 54%),
    rgba(17,7,38,.54);
  color: #fff;
  text-align: left;
  text-decoration: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06),0 8px 18px rgba(0,0,0,.2);
  -webkit-tap-highlight-color: transparent;
}
.hub-choice-option::before {
  content: '';
  position: absolute;
  inset: 9px auto 9px 0;
  width: 4px;
  border-radius: 0 999px 999px 0;
  background: var(--option-accent);
  box-shadow: 0 0 12px color-mix(in srgb,var(--option-accent) 70%,transparent);
}
.hub-choice-option::after {
  content: '›';
  position: absolute;
  right: 10px;
  top: 50%;
  width: 23px;
  height: 23px;
  display: grid;
  place-items: center;
  border: 1px solid color-mix(in srgb,var(--option-accent) 38%,rgba(255,255,255,.14));
  border-radius: 7px;
  background: color-mix(in srgb,var(--option-accent) 11%,rgba(17,7,38,.7));
  color: var(--option-accent);
  font-size: 1.2rem;
  font-weight: 950;
  transform: translateY(-50%);
}
.hub-choice-option strong { overflow: hidden; font-size: .92rem; line-height: 1.12; text-overflow: ellipsis; white-space: nowrap; }
.hub-choice-option span { display: -webkit-box; overflow: hidden; color: #ddd6fe; font-size: .67rem; font-weight: 700; line-height: 1.32; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.hub-choice-option:hover { border-color: var(--option-accent); box-shadow: inset 0 1px 0 rgba(255,255,255,.08),0 10px 22px rgba(0,0,0,.25),0 0 14px color-mix(in srgb,var(--option-accent) 18%,transparent); }

.live-curse-alert {
  display: none;
  width: 100%;
  margin: -7px 0 20px;
  padding: 0;
  border: 0;
  background: transparent;
  text-align: center;
}

.live-curse-alert.show {
  display: block;
}

.live-curse-alert a {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) auto;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 10px 12px;
  border: 1px solid rgba(248, 113, 113, 0.46);
  border-radius: 12px;
  background: linear-gradient(110deg, rgba(88, 18, 30, .82), rgba(46, 16, 102, .78));
  color: #fff;
  line-height: 1.2;
  text-decoration: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.09), 0 8px 20px rgba(0,0,0,.18);
}
.live-curse-alert-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 1px solid rgba(255,255,255,.72);
  border-radius: 10px;
  background:
