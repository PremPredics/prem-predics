<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prem Predics - Live Curses</title>
<script src="assets/js/capacitor-app.js"></script>
<style>
* { box-sizing: border-box; }
:root { color-scheme: dark; --curse-red: #ff5e57; --curse-orange: #fb923c; }
body {
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
  color: #f3f4f6;
  background: linear-gradient(135deg, #7b61d8 0%, #a98cf0 52%, #d3c4ff 100%);
}
header {
  padding: 25px 20px;
  background: linear-gradient(90deg, #7354ca 0%, #9677e2 54%, #bda9f5 100%);
  box-shadow: 0 8px 20px rgba(0,0,0,.5);
}
header h1 {
  text-align: center;
  color: #fff;
  -webkit-text-stroke: 1.5px #05010c;
  margin: 0;
  font-size: clamp(2rem, 5.5vw, 3.35rem);
  line-height: 1.05;
  font-weight: 900;
  text-shadow: -2px -2px 0 #05010c, 2px -2px 0 #05010c, -2px 2px 0 #05010c, 2px 2px 0 #05010c, 0 0 12px rgba(216,180,254,.85), 0 0 24px rgba(124,58,237,.55);
}
main { width: min(1240px, 100%); margin: 0 auto; padding: 32px 18px 48px; }
.toolbar { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
.toolbar a {
  padding: 10px 13px;
  border: 1px solid rgba(216,180,254,.28);
  border-radius: 8px;
  background: rgba(17,7,38,.68);
  color: #f3e8ff;
  font-weight: 800;
  text-decoration: none;
}
.curse-hero {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(320px, .65fr);
  gap: 20px;
  align-items: center;
  padding: clamp(20px, 4vw, 36px);
  border: 2px solid rgba(196,132,252,.32);
  border-radius: 12px;
  background:
    radial-gradient(circle at 78% 18%, rgba(248,113,113,.14), transparent 28%),
    rgba(46,16,102,.66);
  box-shadow: 0 14px 34px rgba(0,0,0,.28);
}
.curse-hero::after {
  content: '\1F525';
  position: absolute;
  right: 3%;
  bottom: -54px;
  font-size: 190px;
  opacity: .06;
  filter: saturate(1.4);
}
.eyebrow { margin: 0 0 7px; color: #ddd6fe; font-size: .78rem; font-weight: 950; letter-spacing: .16em; text-transform: uppercase; }
.curse-hero h2 { margin: 0; color: #fff; font-size: clamp(2rem, 7vw, 4.2rem); line-height: 1; font-weight: 950; }
.curse-hero h2 span { color: var(--curse-red); text-shadow: 0 0 18px rgba(248,113,113,.52); }
.hero-copy { max-width: 680px; margin: 14px 0 0; color: #ddd6fe; line-height: 1.55; font-weight: 650; }
.live-indicator { display: inline-flex; align-items: center; gap: 8px; margin-top: 15px; color: #fecaca; font-size: .8rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
.live-dot { width: 9px; height: 9px; border-radius: 50%; background: #ff453a; box-shadow: 0 0 0 5px rgba(255,69,58,.13), 0 0 16px #ff453a; animation: livePulse 1.8s ease-in-out infinite; }
.hero-stats { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.hero-stat { min-height: 96px; display: grid; place-content: center; padding: 12px; border: 1px solid rgba(216,180,254,.24); border-radius: 8px; background: rgba(17,7,38,.46); text-align: center; }
.hero-stat:first-child { grid-column: 1 / -1; }
.hero-stat strong { color: #fff; font-size: clamp(1.65rem, 5vw, 2.8rem); line-height: 1; text-shadow: 0 0 16px rgba(255,91,69,.56); }
.hero-stat span { margin-top: 6px; color: #ddd6fe; font-size: .72rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
.own-curse-alert {
  display: none;
  margin: 18px 0 0;
  padding: 14px 18px;
  border: 1px solid rgba(255,117,96,.72);
  border-radius: 8px;
  background: rgba(69,10,10,.78);
  color: #ff7466;
  text-align: center;
  font-weight: 1000;
  box-shadow: 0 0 22px rgba(239,68,68,.25);
}
.own-curse-alert.show { display: block; }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 28px 2px 14px; }
.section-heading h2 { margin: 0; font-size: clamp(1.3rem, 4vw, 2rem); }
.section-heading p { margin: 0; color: #ede9fe; font-size: .88rem; text-align: right; }
.victim-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.victim-card {
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255,111,86,.4);
  border-radius: 12px;
  background: rgba(46,16,102,.72);
  box-shadow: 0 14px 30px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.06);
}
.victim-card.is-you { border-color: #ff5e4d; box-shadow: 0 16px 34px rgba(0,0,0,.35), 0 0 24px rgba(239,68,68,.25); }
.victim-head { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid rgba(216,180,254,.18); background: rgba(17,7,38,.28); }
.avatar { flex: 0 0 auto; width: 54px; height: 54px; display: grid; place-items: center; overflow: hidden; border: 3px solid #ff604f; border-radius: 50%; background: linear-gradient(135deg,#f8e7ff,#c084fc); color: #2e1065; font-size: 1.2rem; font-weight: 950; box-shadow: 0 0 14px rgba(248,113,113,.35); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.victim-title { min-width: 0; flex: 1; }
.victim-title strong { display: block; overflow: hidden; color: #fff; font-size: 1.08rem; text-overflow: ellipsis; white-space: nowrap; }
.victim-title span { color: #ddd6fe; font-size: .8rem; font-weight: 800; }
.curse-count { flex: 0 0 auto; display: grid; place-items: center; min-width: 46px; height: 46px; border: 1px solid rgba(254,202,202,.52); border-radius: 8px; background: rgba(127,29,29,.7); color: #fecaca; font-size: 1.25rem; font-weight: 950; }
.curse-stack { display: grid; gap: 10px; padding: 12px; }
.curse-entry { position: relative; padding: 14px; border: 1px solid rgba(248,113,113,.28); border-radius: 8px; background: rgba(17,7,38,.54); }
.curse-entry::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; border-radius: 8px 0 0 8px; background: linear-gradient(#fb923c,#ef4444); box-shadow: 0 0 10px rgba(239,68,68,.62); }
.curse-name { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.curse-name strong { color: #ff7767; font-size: 1rem; }
.gw-chip { flex: 0 0 auto; padding: 4px 7px; border: 1px solid rgba(254,202,202,.34); border-radius: 999px; color: #fecaca; font-size: .68rem; font-weight: 950; }
.curse-description { margin: 7px 0 10px; color: #ede9fe; font-size: .84rem; line-height: 1.42; }
.curse-meta { display: flex; align-items: center; gap: 8px; color: #c4b5fd; font-size: .75rem; font-weight: 750; }
.mini-avatar { width: 26px; height: 26px; display: grid; place-items: center; overflow: hidden; border: 1px solid rgba(255,255,255,.42); border-radius: 50%; background: #6d28d9; color: #fff; font-weight: 950; }
.mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
.empty-state, .loading-state, .error-state { grid-column: 1 / -1; padding: 42px 20px; border: 1px dashed rgba(216,180,254,.46); border-radius: 12px; background: rgba(46,16,102,.66); text-align: center; }
.empty-icon { display: block; margin-bottom: 10px; font-size: 3rem; filter: grayscale(.4); }
.empty-state h3, .error-state h3 { margin: 0 0 7px; font-size: 1.35rem; }
.empty-state p, .loading-state p, .error-state p { margin: 0; color: #ddd6fe; line-height: 1.5; }
.retry-btn { margin-top: 14px; padding: 9px 15px; border: 1px solid rgba(216,180,254,.5); border-radius: 8px; background: rgba(17,7,38,.72); color: #fff; font: inherit; font-weight: 900; cursor: pointer; }
footer { padding: 20px; color: #4c1d95; text-align: center; font-size: 13px; font-weight: 700; }
@keyframes livePulse { 50% { opacity: .52; transform: scale(.78); } }
@media (max-width: 760px) {
  .curse-hero { grid-template-columns: 1fr; }
  .hero-stats { grid-template-columns: repeat(3, 1fr); }
  .hero-stat:first-child { grid-column: auto; }
  .victim-grid { grid-template-columns: 1fr; }
}
@media (max-width: 650px) {
  header h1 {
    -webkit-text-stroke: 0;
    text-shadow: -1px -1px 0 #05010c, 1px -1px 0 #05010c, -1px 1px 0 #05010c, 1px 1px 0 #05010c, 0 0 10px rgba(216,180,254,.72);
    font-size: 1.32rem;
    line-height: 1.05;
    white-space: nowrap;
  }
}
@media (max-width: 480px) {
  header { padding: max(16px, calc(env(safe-area-inset-top, 0px) + 12px)) 10px 15px; }
  main { padding: 18px 10px 38px; }
  .curse-hero { padding: 19px 15px; }
  .hero-stats { gap: 6px; }
  .hero-stat { min-height: 78px; padding: 8px 4px; }
  .hero-stat strong { font-size: 1.5rem; }
  .hero-stat span { font-size: .58rem; }
  .section-heading { align-items: start; flex-direction: column; }
  .section-heading p { text-align: left; }
  .victim-head { padding: 13px 11px; }
  .avatar { width: 46px; height: 46px; }
  .curse-stack { padding: 9px; }
  .curse-entry { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; } }
</style>

<header><h1>Prem Predics - Live Curses</h1></header>
<main>
  <div class="toolbar"><a data-league-link href="league.html">Back To League Hub</a></div>
  <section class="curse-hero">
    <div>
      <h2><span data-gameweek-label>GW--</span> Live Curses</h2>

      <div class="hero-stat"><strong data-live-count>--</strong><span>Live Curses</span></div>

</main>
<footer>2026 Prem Predics | Live Curses</footer>
