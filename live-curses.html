<style>
* { box-sizing: border-box; }
:root { color-scheme: dark; --curse-red: #ff5e57; --curse-orange: #fb923c; }
body {
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
  color: #f3f4f6;
  background: linear-gradient(135deg, #7b61d8 0%, #a98cf0 52%, #d3c4ff 100%);
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
header {
  padding: 25px 20px;
  background: linear-gradient(90deg, #7354ca 0%, #9677e2 54%, #bda9f5 100%);
  box-shadow: 0 8px 20px rgba(0,0,0,.5);
}
header h1 {
  text-align: center;
  color: #fff;
  -webkit-text-stroke: 1.5px #05010c;
  margin: 0;
  font-size: clamp(2rem, 5.5vw, 3.35rem);
  line-height: 1.05;
  font-weight: 900;
  text-shadow: -2px -2px 0 #05010c, 2px -2px 0 #05010c, -2px 2px 0 #05010c, 2px 2px 0 #05010c, 0 0 12px rgba(216,180,254,.85), 0 0 24px rgba(124,58,237,.55);
}
main { width: min(1240px, 100%); margin: 0 auto; padding: 24px 18px 48px; }
.toolbar { display: flex; justify-content: center; gap: 12px; margin-bottom: 14px; }
.toolbar a {
  padding: 8px 12px;
  border: 1px solid rgba(216,180,254,.28);
  border-radius: 9px;
  background: linear-gradient(145deg,rgba(46,16,102,.7),rgba(17,7,38,.66));
  color: #f3e8ff;
  font-weight: 800;
  text-decoration: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07),0 6px 16px rgba(0,0,0,.16);
}
.curse-hero {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(390px, .8fr);
  gap: 14px;
  align-items: center;
  padding: 14px;
  border: 1px solid rgba(248,113,113,.32);
  border-radius: 12px;
  background:
    linear-gradient(110deg,rgba(239,68,68,.1),transparent 42%),
    linear-gradient(145deg,rgba(46,16,102,.72),rgba(17,7,38,.62));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.2);
}
.curse-hero-copy { min-width: 0; padding: 2px 5px; }
.curse-hero h2 { margin: 0; color: #fff; font-size: clamp(1.4rem, 3.4vw, 2.05rem); line-height: 1.05; font-weight: 950; letter-spacing: -.02em; }
.curse-hero h2 span { color: #fca5a5; }
.live-indicator { display: inline-flex; align-items: center; gap: 7px; margin-top: 7px; color: #fecaca; font-size: .66rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: #f87171; box-shadow: 0 0 0 3px rgba(248,113,113,.12),0 0 10px rgba(248,113,113,.42); animation: livePulse 1.8s ease-in-out infinite; }
.hero-stats { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 7px; }
.hero-stat {
  --stat-color: #fb7185;
  min-width: 0;
  min-height: 62px;
  display: grid;
  place-content: center;
  gap: 4px;
  padding: 8px 6px;
  border: 1px solid color-mix(in srgb,var(--stat-color) 36%,rgba(216,180,254,.2));
  border-radius: 9px;
  background:
    linear-gradient(120deg,color-mix(in srgb,var(--stat-color) 9%,transparent),transparent 58%),
    rgba(17,7,38,.52);
  text-align: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
}
.hero-stat:nth-child(2) { --stat-color: #fbbf24; }
.hero-stat:nth-child(3) { --stat-color: #4ade80; }
.hero-stat strong { color: #fff; font-size: clamp(1.25rem, 3vw, 1.65rem); line-height: 1; text-shadow: 0 0 10px color-mix(in srgb,var(--stat-color) 42%,transparent); }
.hero-stat span { color: var(--stat-color); font-size: .61rem; font-weight: 950; letter-spacing: .075em; line-height: 1.12; text-transform: uppercase; }
.own-curse-alert {
  display: none;
  margin: 18px 0 0;
  padding: 14px 18px;
  border: 1px solid rgba(248,113,113,.46);
  border-radius: 12px;
  background: linear-gradient(110deg,rgba(88,18,30,.82),rgba(46,16,102,.78));
  color: #fecaca;
  text-align: center;
  font-weight: 1000;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08),0 8px 20px rgba(0,0,0,.18);
}
.own-curse-alert.show { display: block; }
.section-heading { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 23px auto 13px; text-align: center; }
.section-heading::before, .section-heading::after { content: ''; flex: 1 1 90px; max-width: 130px; height: 1px; background: linear-gradient(90deg,transparent,rgba(216,180,254,.6)); }
.section-heading::after { transform: rotate(180deg); }
.section-heading h2 { margin: 0; color: #fff; font-size: clamp(1.22rem,4vw,1.72rem); line-height: 1; letter-spacing: .02em; }
.victim-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.victim-card {
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(216,180,254,.3);
  border-radius: 12px;
  background: linear-gradient(145deg,rgba(46,16,102,.76),rgba(17,7,38,.58));
  box-shadow: 0 12px 28px rgba(0,0,0,.23), inset 0 1px 0 rgba(255,255,255,.06);
}
.victim-card.is-you { border-color: rgba(248,113,113,.64); box-shadow: 0 14px 30px rgba(0,0,0,.28),0 0 0 1px rgba(248,113,113,.12); }
.victim-head { display: flex; align-items: center; gap: 11px; padding: 12px 13px; border-bottom: 1px solid rgba(216,180,254,.15); background: rgba(17,7,38,.38); }
.avatar { flex: 0 0 auto; width: 52px; height: 52px; display: grid; place-items: center; overflow: hidden; border: 2px solid rgba(248,113,113,.72); border-radius: 50%; background: linear-gradient(135deg,#f8e7ff,#c084fc); color: #2e1065; font-size: 1.2rem; font-weight: 950; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.victim-title { min-width: 0; flex: 1; }
.victim-title strong { display: block; overflow: hidden; color: #fff; font-size: 1.08rem; text-overflow: ellipsis; white-space: nowrap; }
.victim-title span { color: #ddd6fe; font-size: .8rem; font-weight: 800; }
.curse-count { flex: 0 0 auto; display: grid; place-content: center; min-width: 44px; height: 44px; border: 1px solid rgba(248,113,113,.34); border-radius: 9px; background: linear-gradient(145deg,rgba(127,29,29,.58),rgba(76,5,25,.4)); text-align: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.curse-count b { color: #fff; font-size: 1.15rem; line-height: 1; }
.curse-count small { margin-top: 3px; color: #fca5a5; font-size: .56rem; font-weight: 950; letter-spacing: .08em; text-transform: uppercase; }
.segment-label { display: block; margin: 0 0 9px 2px; color: #c4b5fd; font-size: .66rem; font-weight: 950; letter-spacing: .11em; text-transform: uppercase; }
.curse-card-segment { min-height: 132px; padding: 12px; background: rgba(17,7,38,.3); }
.curse-stack { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); align-items: start; gap: 10px; }
.curse-card-slot { display: grid; place-items: start center; min-width: 0; min-height: 112px; padding: 8px; border: 1px solid rgba(216,180,254,.13); border-radius: 10px; background: rgba(17,7,38,.38); }
.curse-effects-segment { padding: 12px; border-top: 1px solid rgba(216,180,254,.15); background: rgba(17,7,38,.24); }
.curse-effects-grid { display: grid; grid-template-columns: minmax(0,1fr); gap: 10px; }
.curse-effect-entry { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 12px; border: 1px solid rgba(216,180,254,.18); border-radius: 10px; background: rgba(17,7,38,.44); box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
.live-curse-card {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: min(100%,86px);
  aspect-ratio: 72 / 94;
  display: grid;
  place-items: center;
  align-self: center;
  margin-inline: auto;
  padding: 12px 9px;
  border: 2px solid #fb7185;
  border-radius: 10px;
  background:
    radial-gradient(circle at 24% 18%, rgba(254,202,202,.58), transparent 20%),
    radial-gradient(circle at 78% 75%, rgba(76,5,25,.6), transparent 32%),
    linear-gradient(45deg, rgba(255,255,255,.18) 0 11%, transparent 11% 25%, rgba(255,255,255,.14) 25% 36%, transparent 36% 100%),
    linear-gradient(135deg,#4c0519 0%,#991b1b 24%,#ef4444 50%,#be123c 72%,#fecaca 100%);
  box-shadow: 0 0 18px rgba(251,113,133,.58), 0 4px 12px rgba(0,0,0,.4), inset 0 0 12px rgba(255,255,255,.14);
}
.live-card-name { max-width: 100%; color: #fff; font-size: clamp(.78rem, 1.55vw, 1rem); line-height: 1.05; font-weight: 1000; text-align: center; text-shadow: -1px -1px 0 rgba(0,0,0,.92), 1px -1px 0 rgba(0,0,0,.92), -1px 1px 0 rgba(0,0,0,.92), 1px 1px 0 rgba(0,0,0,.92), 0 0 10px rgba(254,202,202,.6); overflow-wrap: normal; word-break: normal; hyphens: none; }
.curse-card-slot.is-vetoed { border-color: rgba(203,213,225,.22); background: rgba(15,23,42,.5); }
.live-curse-card.is-vetoed { border-color: #cbd5e1; filter: grayscale(.88); opacity: .72; box-shadow: 0 0 12px rgba(148,163,184,.34),0 4px 12px rgba(0,0,0,.42),inset 0 0 12px rgba(255,255,255,.1); }
.live-curse-card.is-vetoed::after { content: ''; position: absolute; inset: 0; z-index: 2; background: repeating-linear-gradient(-32deg,transparent 0 8px,rgba(15,23,42,.2) 8px 15px); pointer-events: none; }
.vetoed-stamp { position: absolute; z-index: 3; left: 6px; right: 6px; bottom: 8px; padding: 3px 2px; border: 1px solid rgba(255,255,255,.72); border-radius: 5px; background: rgba(15,23,42,.82); color: #f8fafc; font-size: .48rem; font-weight: 1000; letter-spacing: .11em; text-align: center; text-transform: uppercase; transform: rotate(-6deg); }
.curse-impact {
  padding: 11px 12px;
  border: 1px solid rgba(248,113,113,.2);
  border-left: 3px solid #fda4af;
  border-radius: 0 8px 8px 0;
  background: linear-gradient(110deg,rgba(127,29,29,.55),rgba(76,5,25,.34));
  color: #fff1f2;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
}
.curse-impact.is-locked { border-left-color: #fda4af; background: linear-gradient(110deg,rgba(127,29,29,.55),rgba(76,5,25,.34)); }
.curse-effect-entry.is-vetoed { border-color: rgba(148,163,184,.28); background: rgba(15,23,42,.48); }
.curse-impact.is-vetoed { border-color: rgba(148,163,184,.3); border-left-color: #cbd5e1; background: linear-gradient(110deg,rgba(51,65,85,.68),rgba(15,23,42,.58)); color: #e2e8f0; }
.curse-impact.is-vetoed .impact-kicker { color: #cbd5e1; }
.impact-kicker { display: block; margin-bottom: 5px; color: #fca5a5; font-size: .7rem; font-weight: 1000; letter-spacing: .13em; text-transform: uppercase; }
.curse-impact > strong { display: block; margin-bottom: 8px; color: #fff; font-size: 1rem; line-height: 1.25; }
.curse-impact > p { margin: 0; font-size: .9rem; line-height: 1.48; }
.curse-impact > small { display: block; margin-top: 9px; color: #fecdd3; font-size: .78rem; line-height: 1.42; }
.forced-score-list { display: grid; gap: 5px; }
.forced-score-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 9px 11px; border: 1px solid rgba(255,255,255,.08); border-radius: 8px; background: rgba(17,7,38,.58); }
.forced-score-row span { overflow: hidden; font-size: .88rem; font-weight: 850; text-overflow: ellipsis; white-space: nowrap; }
.forced-score-row b { min-width: 50px; padding: 3px 7px; border-radius: 6px; background: rgba(127,29,29,.54); color: #fecaca; font-size: 1.05rem; text-align: center; }
.thief-effect { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: 12px; align-items: center; }
.thief-effect > p { margin: 0; color: #fff1f2; font-size: .9rem; line-height: 1.45; }
.thief-effect > p strong { color: #fff; }
.stolen-card-preview {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 76px;
  aspect-ratio: 72 / 94;
  display: grid;
  place-content: center;
  gap: 5px;
  padding: 8px 6px;
  border: 2px solid rgba(255,255,255,.68);
  border-radius: 9px;
  color: #fff;
  text-align: center;
  box-shadow: 0 4px 12px rgba(0,0,0,.38),inset 0 0 10px rgba(255,255,255,.15);
}
.stolen-card-preview.power-card { background: linear-gradient(135deg,#082f49,#0369a1 40%,#38bdf8 70%,#dbeafe); border-color: #7dd3fc; }
.stolen-card-preview.curse-card { background: linear-gradient(135deg,#4c0519,#991b1b 40%,#ef4444 70%,#fecaca); border-color: #fb7185; }
.stolen-card-preview.regular-card { background: linear-gradient(135deg,#2e1065,#6d28d9 44%,#a78bfa 74%,#ede9fe); border-color: #c4b5fd; }
.stolen-card-preview small { color: rgba(255,255,255,.82); font-size: .48rem; font-weight: 950; letter-spacing: .07em; text-transform: uppercase; }
.stolen-card-preview strong { font-size: .65rem; line-height: 1.04; text-shadow: -1px -1px 0 rgba(0,0,0,.8),1px 1px 0 rgba(0,0,0,.8); overflow-wrap: anywhere; }
.curse-meta { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 0 2px; color: #c4b5fd; }
.curse-meta-copy { min-width: 0; }
.curse-meta-copy strong { display: block; overflow: hidden; color: #fff; font-size: .8rem; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
.curse-meta-copy small { display: block; margin-top: 3px; overflow: hidden; color: #c4b5fd; font-size: .68rem; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
.mini-avatar { width: 26px; height: 26px; display: grid; place-items: center; overflow: hidden; border: 1px solid rgba(255,255,255,.42); border-radius: 50%; background: #6d28d9; color: #fff; font-weight: 950; }
.mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
.empty-state, .loading-state, .error-state { grid-column: 1 / -1; padding: 42px 20px; border: 1px dashed rgba(216,180,254,.46); border-radius: 12px; background: rgba(46,16,102,.66); text-align: center; }
.empty-state h3, .error-state h3 { margin: 0 0 7px; font-size: 1.35rem; }
.empty-state p, .loading-state p, .error-state p { margin: 0; color: #ddd6fe; line-height: 1.5; }
.retry-btn { margin-top: 14px; padding: 9px 15px; border: 1px solid rgba(216,180,254,.5); border-radius: 8px; background: rgba(17,7,38,.72); color: #fff; font: inherit; font-weight: 900; cursor: pointer; }
footer { padding: 20px; color: #4c1d95; text-align: center; font-size: 13px; font-weight: 700; }
@keyframes livePulse { 50% { opacity: .52; transform: scale(.78); } }
