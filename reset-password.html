<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Reset Password - Prem Predics</title>
<link rel="stylesheet" href="assets/css/legal-pages.css">
<link rel="stylesheet" href="assets/css/password-reset.css">
<link rel="stylesheet" href="assets/css/pwa-install.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7b61d8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prem Predics">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/pwa/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/pwa/favicon-32.png">
</head>
<body>
<header class="legal-header">
  <a href="login.html" aria-label="Back to Prem Predics login">
    <img class="legal-logo" src="logo-left.png" alt="Prem Predics Logo">
  </a>
  <h1>Prem Predics</h1>
</header>

<main class="legal-shell password-reset-shell">
  <p class="legal-kicker">Account recovery</p>
  <h2>Choose a new password</h2>
  <p class="password-reset-intro">Use at least 6 characters and choose a password you do not use elsewhere.</p>

  <div class="password-reset-status" data-reset-status data-type="info" role="status" aria-live="polite">
    Checking your secure reset link…
  </div>

  <form class="password-reset-form" data-reset-form hidden>
    <label>
      New password
      <input name="newPassword" type="password" autocomplete="new-password" minlength="6" required>
    </label>

    <label>
      Confirm new password
      <input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
    </label>

    <button type="submit" data-reset-submit>Update Password</button>
  </form>

  <a class="password-reset-link" href="login.html?mode=recovery" data-request-new-link hidden>Request a new reset link</a>
  <a class="password-reset-link password-reset-link-secondary" href="login.html" data-back-to-login>Back to Log In</a>
  <a class="password-reset-link password-reset-link-secondary" href="index.html" data-continue-to-app hidden>Continue to Prem Predics</a>
</main>

<footer>2026 Prem Predics | Password Reset</footer>

<script type="module" src="assets/js/reset-password.js"></script>
<script src="assets/js/pwa.js" defer></script>
<script src="assets/js/wider-polish.js" defer></script>
<script src="assets/js/legal-footer.js" defer></script>
</body>
</html>
