<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prem Predics - Medals</title>
<style>
* { box-sizing: border-box; }

body {
  min-height: 100vh;
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #7b61d8 0%, #a98cf0 52%, #d3c4ff 100%);
  color: #f3f4f6;
}

header {
  padding: 24px 16px;
  background: linear-gradient(90deg, #7354ca 0%, #9677e2 54%, #bda9f5 100%);
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

header h1 {
  text-align: center;
  color: #fff;
  -webkit-text-stroke: 1.5px #05010c;
  text-shadow:
    -2px -2px 0 #05010c,
    2px -2px 0 #05010c,
    -2px 2px 0 #05010c,
    2px 2px 0 #05010c,
    0 0 12px rgba(216, 180, 254, 0.85),
    0 0 24px rgba(124, 58, 237, 0.55);
  margin: 0;
  font-size: clamp(2rem, 5.5vw, 3.35rem);
  line-height: 1.05;
  font-weight: 900;
}

main {
  width: min(1120px, 100%);
  margin: 0 auto;
  padding: 28px 14px 44px;
}

.toolbar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.toolbar a {
  color: #f3e8ff;
  text-decoration: none;
  font-weight: 900;
  background: rgba(17, 7, 38, 0.72);
  border: 1px solid rgba(216, 180, 254, 0.32);
  border-radius: 8px;
  padding: 10px 13px;
}

.panel {
  background: linear-gradient(145deg,rgba(46,16,102,.66),rgba(17,7,38,.56));
  border: 1px solid rgba(216,180,254,.3);
  border-radius: 13px;
  padding: 14px;
  box-shadow: 0 12px 28px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.06);
}

.medal-progress-panel {
  margin: 0 0 12px;
  padding: 12px;
  border: 1px solid rgba(167,139,250,.36);
  border-radius: 12px;
  background: linear-gradient(145deg,rgba(46,16,102,.64),rgba(17,7,38,.58));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.18);
}
.medal-progress-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.medal-progress-heading strong { color: #f5f3ff; font-size: .78rem; letter-spacing: .07em; text-transform: uppercase; }
.medal-progress-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
.medal-progress-card { --medal-color:#facc15; min-width: 0; padding: 10px; border: 1px solid color-mix(in srgb,var(--medal-color) 34%,rgba(216,180,254,.2)); border-radius: 9px; background: rgba(17,7,38,.52); }
.medal-progress-card.goal-progress { --medal-color:#4ade80; }
.medal-progress-top,.medal-progress-copy { display: flex; align-items: center; justify-content: space-between; gap: 7px; min-width: 0; }
.medal-progress-top span { min-width: 0; overflow: hidden; color: var(--medal-color); font-size: .72rem; font-weight: 950; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
.medal-progress-top i { margin-right: 5px; font-style: normal; }
.medal-progress-top strong { color: #fff; font-size: .82rem; }
.medal-progress-copy { margin: 5px 0 6px; }
.medal-progress-copy b { color: #fff; font-size: .88rem; white-space: nowrap; }
.medal-progress-copy span { overflow: hidden; color: #ddd6fe; font-size: .67rem; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
.medal-progress-track { height: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.13); border-radius: 999px; background: rgba(3,1,10,.72); box-shadow: inset 0 2px 4px rgba(0,0,0,.55); }
.medal-progress-track span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg,color-mix(in srgb,var(--medal-color) 68%,#7c3aed),var(--medal-color)); box-shadow: 0 0 10px var(--medal-color); transition: width .55s ease; }
.medal-progress-card.complete .medal-progress-track span { background: linear-gradient(90deg,#f59e0b,#fff2a8,#facc15); }
.medal-progress-loading { display: block; color: #ddd6fe; font-size: .75rem; text-align: center; }

.summary-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 12px;
}

.summary-pill {
  width: min(100%, 460px);
  display: inline-flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  border-radius: 9px;
  padding: 9px 12px;
  background: rgba(17,7,38,.5);
  border: 1px solid rgba(216,180,254,.2);
}

.summary-pill span {
  color: #ddd6fe;
  font-size: .8rem;
  font-weight: 900;
  letter-spacing: .05em;
  text-transform: uppercase;
}

.summary-pill strong {
  color: #fde68a;
  font-size: 1.55rem;
  line-height: 1;
}

.medal-board {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(175px,1fr));
  gap: 8px;
}

.medal-accolade {
  min-height: 68px;
  display: grid;
  align-content: center;
  gap: 4px;
  padding: 10px;
  border-radius: 8px;
  background: rgba(12, 6, 26, 0.66);
  border: 1px solid rgba(216, 180, 254, 0.16);
  color: #c4b5fd;
  filter: grayscale(0.8);
  opacity: 0.48;
  text-align: left;
  transition: opacity 0.2s, filter 0.2s, box-shadow 0.2s, border-color 0.2s;
}

.medal-accolade.unlocked {
  opacity: 1;
  filter: none;
  border-color: rgba(250, 204, 21, 0.78);
  box-shadow: 0 0 20px rgba(250, 204, 21, 0.34), inset 0 0 14px rgba(250, 204, 21, 0.1);
}

.medal-accolade strong {
  color: #fff;
  font-size: .85rem;
  font-weight: 900;
}

.medal-accolade.unlocked strong {
  color: #fde68a;
  text-shadow:
    -1px -1px 0 rgba(0,0,0,0.8),
    1px -1px 0 rgba(0,0,0,0.8),
    -1px 1px 0 rgba(0,0,0,0.8),
    1px 1px 0 rgba(0,0,0,0.8);
}

.medal-accolade span {
  justify-self: start;
  border-radius: 999px;
  padding: 3px 7px;
  background: rgba(255,255,255,0.1);
  color: #ddd6fe;
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
}

.medal-accolade.unlocked span {
  background: rgba(250, 204, 21, 0.18);
  color: #fff;
}

.empty,
.message {
  margin: 0;
  color: #ddd6fe;
  line-height: 1.5;
  text-align: center;
}

.super-pen-medals {
  margin-top: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background:
    radial-gradient(circle at 14% 18%, rgba(255,255,255,0.28), transparent 22%),
    linear-gradient(135deg, rgba(96, 40, 136, 0.82), rgba(182, 126, 20, 0.78), rgba(46, 16, 102, 0.86));
  border-color: rgba(255, 240, 163, 0.58);
  box-shadow: 0 0 18px rgba(250,204,21,.2),0 10px 24px rgba(0,0,0,.24);
}

.super-pen-medals-copy {
  display: grid;
  gap: 4px;
}

.super-pen-medals-copy strong {
  color: #fde68a;
  font-size: 1rem;
  font-weight: 950;
  text-shadow:
    -1px -1px 0 rgba(0,0,0,0.86),
    1px -1px 0 rgba(0,0,0,0.86),
    -1px 1px 0 rgba(0,0,0,0.86),
    1px 1px 0 rgba(0,0,0,0.86);
}

.super-pen-medals-copy span {
  color: #fff7ed;
  font-size: .8rem;
  font-weight: 750;
  line-height: 1.35;
}

.super-pen-medals-count {
  min-width: 48px;
  min-height: 48px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  background:
    radial-gradient(circle at 34% 24%, rgba(255,255,255,0.72), transparent 20%),
    linear-gradient(135deg, #facc15, #f59e0b);
  border: 2px solid rgba(255, 255, 255, 0.75);
  color: #111827;
  font-size: 1.3rem;
  font-weight: 950;
  box-shadow: 0 0 24px rgba(250, 204, 21, 0.48), inset 0 -10px 18px rgba(146, 64, 14, 0.25);
  text-shadow: 0 1px 0 rgba(255,255,255,0.42);
}

footer {
  text-align: center;
  padding: 20px;
  color: #4c1d95;
  border-top: 1px solid rgba(167, 139, 250, 0.3);
}

@media (max-width: 620px) {
  main { padding: 20px 9px 32px; }
  .panel { padding: 10px; }
  .medal-progress-panel { padding: 9px; }
  .medal-progress-heading { margin-bottom: 7px; }
  .medal-progress-heading strong { font-size: .7rem; }
  .medal-progress-grid { gap: 7px; }
  .medal-progress-card { padding: 8px 7px; }
  .medal-progress-top span { font-size: .62rem; }
  .medal-progress-top strong { font-size: .72rem; }
  .medal-progress-copy { align-items: flex-start; flex-direction: column; gap: 2px; margin: 5px 0 6px; }
  .medal-progress-copy b { font-size: .76rem; }
  .medal-progress-copy span { width: 100%; font-size: .6rem; text-align: left; }
  .medal-progress-track { height: 7px; }
  .summary-pill { width: 100%; padding: 8px 10px; }
  .summary-pill span { font-size: .68rem; }
  .summary-pill strong { font-size: 1.3rem; }
  .medal-board { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 6px; }
  .medal-accolade { min-height: 62px; padding: 8px; }
  .medal-accolade strong { font-size: .72rem; line-height: 1.18; }
  .medal-accolade span { padding: 3px 5px; font-size: 8px; }
  .toolbar a { flex: 1; text-align: center; }
  .super-pen-medals {
    align-items: center;
    flex-direction: row;
    padding: 10px 12px;
    text-align: left;
  }
  .super-pen-medals-copy strong { font-size: .9rem; }
  .super-pen-medals-copy span { font-size: .68rem; }
  .super-pen-medals-count { min-width: 44px; min-height: 44px; font-size: 1.15rem; }
}
@media (max-width: 650px) {
  header h1,
  body > h1 {
    -webkit-text-stroke: 0;
    text-shadow:
      -1px -1px 0 #05010c,
      1px -1px 0 #05010c,
      -1px 1px 0 #05010c,
      1px 1px 0 #05010c,
      0 0 10px rgba(216, 180, 254, 0.75);
    font-size: clamp(1.55rem, 8vw, 2.2rem);
    line-height: 1.12;
  }
}

/* mobile-title-one-line */
@media (max-width: 650px) {
  header h1,
  body > h1 {
    -webkit-text-stroke: 0 !important;
    text-shadow:
      -1px -1px 0 #05010c,
      1px -1px 0 #05010c,
      -1px 1px 0 #05010c,
      1px 1px 0 #05010c,
      0 0 10px rgba(216, 180, 254, 0.72) !important;
    font-size: 1.32rem !important;
    line-height: 1.05 !important;
    white-space: nowrap !important;
    letter-spacing: 0 !important;
  }
}
